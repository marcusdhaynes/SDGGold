name: SDGGold · Validate and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application assets and HTML
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s course-package.js
          test -s EXAMPLE_COMPLETE_COURSE.json
          test -s CHATGPT_COURSE_TEMPLATE.md
          test -s course-studio.js
          test -s settings-reference.js
          test -s settings-ui.js
          test -s settings-panel.html
          test -s settings.css
          test -s graph-layout.js
          test -s graph-tracks.css
          test -s layout-controls.css
          test -s tree-gestures.js
          grep -q 'SDGGold' index.html
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
            def error(self, message):
              raise ValueError(message)
          with open('index.html',encoding='utf-8') as f:
            P().feed(f.read())
          print('HTML parsed successfully')
          PY
      - name: Check JavaScript syntax and progression invariants
        run: |
          for file in app.js course-package.js graph-layout.js tree-gestures.js architect-store.js course-cloud.js course-studio.js settings-reference.js settings-ui.js sw.js; do node --check "$file"; done
          node --test tests/*.test.cjs
          node tools/validate-course.cjs EXAMPLE_COMPLETE_COURSE.json
          node tools/validate-course.cjs EXAMPLE_BATCH_B001.jsonl EXAMPLE_BATCH_B002.jsonl EXAMPLE_BATCH_B003.jsonl
          node -e "JSON.parse(require('fs').readFileSync('COURSE_PACKAGE_SCHEMA.json','utf8'))"
          grep -q 'sdggold-course-v2' course-package.js
          ! grep -q 'architect-ui.js' index.html
          ! grep -q 'architect-pipeline.js' index.html
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
