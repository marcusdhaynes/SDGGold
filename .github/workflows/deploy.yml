name: SDGGold · Validate and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application assets and HTML
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'SDGGold' index.html
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          class P(HTMLParser):
            def error(self, message):
              raise ValueError(message)
          with open('index.html',encoding='utf-8') as f:
            P().feed(f.read())
          print('HTML parsed successfully')
          PY
      - name: Check JavaScript syntax and progression invariants
        run: |
          node --check app.js
          node --test tests/*.test.cjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
